<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Anti-FOUT: set theme before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Primary Meta. %CORTEX_*% placeholders are filled from site-facts.json at build time (vite.config.ts). -->
    <title>Cortex — a context manager for new and legacy codebases</title>
    <meta name="description" content="Cortex indexes a codebase, ranks what it finds, and writes the context layer every developer's agent reads — AGENTS.md, scoped briefs, a glossary, decisions and committed team memory. Installed as a Claude plugin." />
    <meta name="keywords" content="Cortex, Claude plugin, Claude Code, AGENTS.md, context engineering, codebase context, legacy code, MCP, developer tools" />
    <meta name="author" content="Marin Vanchev" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <link rel="canonical" href="https://marinvch.github.io/cortex-site/" />

    <!-- Favicon & manifest -->
    <link rel="icon" type="image/svg+xml" href="/cortex-site/favicon.svg" />
    <link rel="manifest" href="/cortex-site/manifest.json" />
    <meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0d0b" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marinvch.github.io/cortex-site/" />
    <meta property="og:title" content="Cortex — a context manager for new and legacy codebases" />
    <meta property="og:description" content="Index a codebase, rank what it finds, and write the context layer your agents read. A Claude plugin, free and open-source." />
    <meta property="og:site_name" content="Cortex" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->

    <meta name="twitter:description" content="Index a codebase, rank what it finds, and write the context layer your agents read. A Claude plugin, free and open-source." />
    <meta name="twitter:creator" content="@marinvch" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://github.com" crossorigin />
    <link rel="dns-prefetch" href="https://github.com" />
